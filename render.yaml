services:
  - type: web
    name: replicoach
    runtime: python
    rootDir: backend-ocr
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    plan: free
    region: frankfurt
    healthCheckPath: /docs
    autoDeploy: true
    envVars:
      - key: GEMINI_OCR_MODEL
        value: gemini-3.8-flash
      # Domaine(s) frontend autorisés (CORS), séparés par des virgules, sans slash final
      - key: FRONTEND_ORIGINS
        value: https://replicoach-beige.vercel.app
      # Secrets : à saisir dans le dashboard Render
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
