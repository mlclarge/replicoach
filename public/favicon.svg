<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond bordeaux -->
  <rect width="512" height="512" rx="90" fill="#7c1d3e"/>
  
  <!-- Masque bleu (comédie - souriant) - à gauche -->
  <g transform="translate(85, 95)">
    <!-- Forme du masque -->
    <path d="M120 0 C50 0 0 50 0 130 C0 210 50 280 120 280 C190 280 240 210 240 130 C240 50 190 0 120 0 Z" 
          fill="#2dd4bf" stroke="#1a1a2e" stroke-width="8"/>
    <!-- Œil gauche (souriant, arqué) -->
    <path d="M55 95 Q75 75 95 95" stroke="#1a1a2e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Œil droit (souriant, arqué) -->
    <path d="M145 95 Q165 75 185 95" stroke="#1a1a2e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Grand sourire -->
    <path d="M50 170 Q120 240 190 170" stroke="#1a1a2e" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Masque jaune/orange (tragédie - triste) - à droite, légèrement derrière -->
  <g transform="translate(190, 135)">
    <!-- Forme du masque -->
    <path d="M120 0 C50 0 0 50 0 130 C0 210 50 280 120 280 C190 280 240 210 240 130 C240 50 190 0 120 0 Z" 
          fill="#fbbf24" stroke="#1a1a2e" stroke-width="8"/>
    <!-- Sourcil gauche (triste) -->
    <path d="M50 70 Q75 85 100 70" stroke="#1a1a2e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Sourcil droit (triste) -->
    <path d="M140 70 Q165 85 190 70" stroke="#1a1a2e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Œil gauche -->
    <ellipse cx="75" cy="110" rx="18" ry="22" fill="#1a1a2e"/>
    <!-- Œil droit -->
    <ellipse cx="165" cy="110" rx="18" ry="22" fill="#1a1a2e"/>
    <!-- Larme -->
    <ellipse cx="85" cy="145" rx="8" ry="12" fill="#60a5fa"/>
    <!-- Bouche triste -->
    <path d="M60 200 Q120 160 180 200" stroke="#1a1a2e" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
</svg>
