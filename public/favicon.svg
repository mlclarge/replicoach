<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#7c1d3e"/>
  
  <!-- Masque de théâtre stylisé -->
  <g transform="translate(80, 100)">
    <!-- Masque heureux (gauche) -->
    <path d="M80 0 C20 0 0 60 0 120 C0 200 40 240 80 240 C120 240 160 200 160 120 C160 60 140 0 80 0 Z" 
          fill="#f5f0e6" stroke="#1a1a2e" stroke-width="8"/>
    <!-- Yeux heureux -->
    <ellipse cx="50" cy="100" rx="15" ry="20" fill="#1a1a2e"/>
    <ellipse cx="110" cy="100" rx="15" ry="20" fill="#1a1a2e"/>
    <!-- Sourire -->
    <path d="M40 160 Q80 200 120 160" stroke="#1a1a2e" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Masque triste (droite) -->
    <g transform="translate(192, 0)">
      <path d="M80 0 C20 0 0 60 0 120 C0 200 40 240 80 240 C120 240 160 200 160 120 C160 60 140 0 80 0 Z" 
            fill="#f5f0e6" stroke="#1a1a2e" stroke-width="8"/>
      <!-- Yeux tristes -->
      <ellipse cx="50" cy="110" rx="15" ry="20" fill="#1a1a2e"/>
      <ellipse cx="110" cy="110" rx="15" ry="20" fill="#1a1a2e"/>
      <!-- Sourcils tristes -->
      <path d="M30 80 L70 95" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
      <path d="M130 80 L90 95" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
      <!-- Bouche triste -->
      <path d="M40 190 Q80 160 120 190" stroke="#1a1a2e" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Texte R stylisé en bas -->
  <text x="256" y="420" font-family="Georgia, serif" font-size="80" font-weight="bold" 
        fill="#d4af37" text-anchor="middle">RépliCoach</text>
</svg>
